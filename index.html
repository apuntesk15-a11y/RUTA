  return`<div class="wrap"><div class="head"><span class="eyebrow">Evaluación del prototipo</span><h2>¿Cómo fue tu experiencia en RUTA?</h2><p class="mut">${done<3?`Has completado ${done} de 3 expedientes. Lo ideal es responder al terminar los casos, aunque puedes hacerlo cuando quieras.`:'Completaste los tres expedientes. Tu opinión orienta la siguiente versión.'}</p></div>
<div class="grid g2" style="align-items:start"><form class="panel" id="sv">${SQ.map((q,i)=>`<fieldset style="border:0;padding:0;margin:0"><legend><b>${i+1}. ${q}</b></legend><div class="lik">${[1,2,3,4,5].map(v=>`<button type="button" class="${draft.a[i]===v?'on':''}" data-act="lik" data-i="${i}" data-v="${v}" aria-pressed="${draft.a[i]===v}" aria-label="${v} de 5">${v}</button>`).join('')}</div></fieldset>`).join('')}<p class="small mut" style="margin-top:-8px">1 = muy en desacuerdo · 5 = muy de acuerdo</p><label for="svt"><b>6. ¿Qué mejoraría de la experiencia?</b></label><textarea id="svt" class="inp" data-inp="svt" style="margin-top:8px">${esc(draft.t)}</textarea><div class="row" style="margin-top:16px"><button class="btn btn-p" type="submit" ${draft.a.filter(Boolean).length===5?'':'disabled'}>Enviar evaluación</button></div></form>
<div>${REMOTE?`<div class="panel" style="margin-bottom:18px;border-color:rgba(64,224,208,.5)"><h3>Respuestas en la base de datos</h3><p class="small mut">${REMOTE.n} respuesta${REMOTE.n===1?'':'s'} guardada${REMOTE.n===1?'':'s'} en Firebase por todas las personas que usaron RUTA.</p>${REMOTE.n?SQ.map((q,i)=>`<div class="hbar"><span class="small">${q}</span><em>${REMOTE.avg[i].toFixed(1)}</em><div class="bar"><i data-w="${REMOTE.avg[i]/5*100}"></i></div></div>`).join('')+(REMOTE.txt.length?`<h4 style="margin-top:14px">¿Qué mejoraría?</h4><ul class="list small">${REMOTE.txt.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''):'<p class="mut" style="margin:0">Aún no hay respuestas guardadas.</p>'}</div>`:''}${res(avg,n,S.survey.map(r=>r.t).filter(Boolean),false)}<div class="row" style="margin-top:14px"><button class="btn btn-g" data-act="copysv" ${n?'':'disabled'}>Copiar respuestas (CSV)</button><button class="btn btn-g btn-d" data-act="clrsv" ${n?'':'disabled'}>Borrar respuestas</button><button class="btn btn-g" data-act="demosv" aria-pressed="${showDemo}">${showDemo?'Ocultar':'Ver'} panel de ejemplo</button></div>${showDemo?res(DEMO_SURVEY.avg,DEMO_SURVEY.n,DEMO_SURVEY.txt,true):''}<div id="csvbox"></div></div></div>${DISC}</div>`}

/* ============ VISTA: MATRIZ ============ */
const RUB=[
{t:'Identificación y fundamentación del problema',d:'Delimitación de la problemática a partir de la investigación con estudiantes de Derecho.',ev:[['Problemática claramente delimitada','proceso'],['Contextualización de los estudiantes de Derecho','proceso'],['Evidencia de la investigación inicial','proceso'],['Relación entre las dificultades encontradas y la propuesta','proceso'],['Causas, consecuencias y oportunidades de transformación','proceso']]},
{t:'Investigación y comprensión del contexto',d:'Caracterización de la población, instrumentos, resultados e interpretación que justifican el diseño.',ev:[['Caracterización de la población','proceso'],['Instrumentos de indagación','proceso'],['Resultados obtenidos','proceso'],['Interpretación de los datos','proceso'],['Justificación de las decisiones de diseño','proceso'],['Relación entre usuarios, problemática y producto','proceso']]},
{t:'Creatividad y conceptualización de la propuesta',d:'Concepto de laboratorio de expedientes con narrativa, ramificaciones y gamificación pertinente.',ev:[['Concepto innovador claramente definido','inicio'],['Exploración de alternativas','proceso'],['Originalidad de la propuesta','expedientes'],['Narrativa de casos','expedientes'],['Decisiones ramificadas','expedientes'],['Gamificación pertinente','panel'],['Relación coherente entre el usuario y la solución','proceso'],['Diferenciación frente a una cartilla o recurso tradicional','proceso']]},
{t:'Desarrollo y materialización de la innovación',d:'Prototipo digital funcional, probado y con evidencias de evolución.',ev:[['Prototipo digital funcional','panel'],['Tres casos interactivos','expedientes'],['Expedientes y documentos','expedientes'],['Rutas de decisión','resultado-demo'],['Retroalimentación','resultado-demo'],['Sistema de progreso','panel'],['Evaluación de usuario','evaluacion','auto'],['Evidencias de cambios y mejoras','proceso']]}];
function rubOn(ci,ei){const e=RUB[ci].ev[ei];if(e[2]==='auto')return S.survey.length>0||!!(REMOTE&&REMOTE.n);const k=ci+'-'+ei;return S.rubric[k]!==false}
function vMatrix(){
  const all=RUB.flatMap((r,ci)=>r.ev.map((_,ei)=>rubOn(ci,ei)));const g=r0(all.filter(Boolean).length/all.length*100);
  return`<div class="wrap"><div class="head"><span class="eyebrow">Presentación · uso del equipo</span><h2>Matriz de innovación y evaluación del proyecto</h2><p class="mut">Cuatro criterios de la rúbrica académica, cada uno con un peso del 25 %. Cada evidencia enlaza al lugar del prototipo donde se demuestra. Es una autoevaluación del equipo, no la calificación docente.</p></div>
<div class="panel" style="margin-bottom:18px"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">Avance global de evidencias</h3><span class="small mut">Nivel superior esperado en cada criterio: 4.5–5.0</span></div><b style="font:800 40px Sora,sans-serif" class="gold" data-count="${g}">0</b></div><div class="bar g" style="margin-top:10px;height:10px"><i data-w="${g}"></i></div></div>
<div class="grid g2">${RUB.map((r,ci)=>{const on=r.ev.map((_,ei)=>rubOn(ci,ei)),p=r0(on.filter(Boolean).length/on.length*100),st=p>=90?['Evidencia completa','ok']:p>=60?['En consolidación','gold']:['Por fortalecer','red'],L=2*Math.PI*34;return`<article class="panel crit"><div class="top2"><div class="gauge"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" stroke="rgba(255,255,255,.08)"/><circle cx="42" cy="42" r="34" stroke="url(#gg)" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L}" data-off="${L*(1-p/100)}" style="transition:stroke-dashoffset 1.3s"/></svg><b>${p}%</b></div><div><span class="eyebrow">Criterio ${ci+1} · Peso 25 %</span><h3 style="margin:0">${r.t}</h3></div></div><p class="mut small" style="margin:0">${r.d}</p><div class="row"><span class="tag ${st[1]}">${st[0]}</span><span class="tag">Nivel superior: 4.5–5.0</span></div><div>${r.ev.map((e,ei)=>{const o=on[ei];return`<button class="chk ${o?'on':''} ${e[2]==='auto'?'auto':''}" ${e[2]==='auto'?'':`data-act="rub" data-k="${ci}-${ei}"`} aria-pressed="${o}"><i></i><span>${e[0]}${e[2]==='auto'?` <span class="small ${o?'tq':'gold'}">· ${o?'con respuestas registradas':'sin respuestas registradas'}</span>`:''} <a href="#${e[1]}" data-go="${e[1]}">ver</a></span></button>`}).join('')}</div></article>`}).join('')}</div>${DISC}</div>`}

/* ============ VISTA: CIERRE ============ */
function vClose(){const done=CASES.filter(c=>S.cases[c.id].done).length;
  const K=['INVESTIGACIÓN','PROBLEMÁTICA','IDEACIÓN','PROTOTIPO'];
  const items=[['La problemática identificada','Dificultad de los estudiantes de Derecho para establecer estrategias y rutas de actuación jurídica al analizar y orientar casos.'],['La población investigada','5 estudiantes de Derecho de la Universidad San Mateo (4 de último semestre), todos con práctica en Consultorio Jurídico.'],['El hallazgo principal','El 60 % reportó dificultad para establecer rutas de actuación y el 60 % para definir la orientación de un caso.'],['La solución desarrollada','RUTA: un simulador de toma de decisiones jurídicas con expedientes, consecuencias y retroalimentación.'],['Los tres casos diseñados','Consumidor (“La entrega que nunca llegó”), laboral (“Un último día sin respuestas”) y familia (“Una obligación pendiente”).'],['El prototipo materializado','Plataforma web funcional y adaptable con evidencias, tablero de hechos, decisiones ramificadas, puntuación por dimensiones y mapa de ruta.'],['El proceso de evaluación','El proyecto llega hasta la fase de prototipar. Incluye un instrumento para valorar la experiencia con el prototipo y una matriz de rúbrica para sustentarlo.'],['Las oportunidades de mejora','Ampliar documentos y casos, ajustar la dificultad y revisar los tiempos de resolución.'],['Potencial de implementación futura','Entrenamiento previo al Consultorio Jurídico, banco de casos editable por docentes, nuevas áreas (penal, público) y panel docente con analítica.']];
  return`<div class="wrap" style="text-align:center"><span class="eyebrow">Cierre del recorrido</span><h2>RUTA COMPLETADA: DE LA INVESTIGACIÓN A LA INNOVACIÓN</h2><p class="mut" style="max-width:60ch;margin:0 auto 22px">${done===3?'Los tres expedientes están analizados.':`Expedientes analizados: ${done} de 3. Este resumen del proyecto está disponible en todo momento.`}</p>
<div class="chain" aria-label="Cadena del proyecto">${K.map((k,i)=>`${i?`<span class="a" style="animation-delay:${i*.3-.15}s"></span>`:''}<span class="k ${k==='PROTOTIPO'?'hi':''}" style="animation-delay:${i*.3}s">${k}</span>`).join('')}</div>
<div class="closing" aria-hidden="true"><div class="f"></div><div class="lid">RUTA</div><div class="stamp">EXPEDIENTE CERRADO</div></div></div>
<div class="wrap" style="padding-top:0"><div class="grid g3">${items.map((x,i)=>`<div class="panel" style="animation:fadeUp .6s ${.2+i*.08}s both"><h4>${x[0]}</h4><p style="margin:0">${x[1]}</p></div>`).join('')}</div>
<div class="row" style="justify-content:center;margin-top:22px"><button class="btn btn-p" data-go="matriz">Ver matriz de evaluación</button><button class="btn btn-g" data-go="evaluacion">Evaluar el prototipo</button><button class="btn btn-g" data-go="inicio">Volver al inicio</button></div>${DISC}</div>`}

/* ============ RECORRIDO DEMOSTRATIVO ============ */
let tourOn=false,tourI=0;
const TOUR=[['inicio','RUTA en un minuto','Un laboratorio para practicar la construcción de rutas de actuación jurídica con casos simulados. Este recorrido muestra cada módulo sin necesidad de resolver los casos.'],['panel','Panel del investigador','Perfil, progreso general, casos completados, puntaje acumulado y seis habilidades que se calculan con las decisiones.'],['expedientes','Tres expedientes','Consumidor, laboral y familia: las áreas entre las más señaladas por los estudiantes. Cada uno con narrativa, personajes y documentos propios.'],['caso-c1','Dentro de un expediente','Apertura, evidencias que se abren como documentos, tablero de hechos, cuatro decisiones con consecuencias y la construcción final de la ruta. A la derecha, la ruta se ilumina en vivo.'],['resultado-demo','Resultado y ruta final','Puntaje por dimensiones, nivel de desempeño, fortalezas, aspectos por mejorar, información omitida y el mapa de 8 etapas con oportunidades de mejora.'],['proceso','Del problema al prototipo','Cómo los hallazgos de la encuesta se convirtieron en decisiones de diseño, con la fase de prototipar destacada.'],['evaluacion','Evaluación del prototipo','Seis preguntas para valorar la experiencia con el prototipo. El panel solo muestra respuestas reales registradas; el ejemplo está marcado como ficticio.'],['matriz','Matriz de la rúbrica','Los cuatro criterios (25 % cada uno) con sus evidencias enlazadas al prototipo y su nivel de avance.'],['cierre','De la investigación a la innovación','La síntesis final del proyecto: problemática, población, hallazgo, solución, evaluación y potencial de implementación.']];
function renderTour(){const t=TOUR[tourI];$('#tour').innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag gold">Recorrido ${tourI+1} / ${TOUR.length}</span><button class="mclose" style="background:transparent;color:#F3F6FC;border-color:rgba(76,169,255,.3)" data-act="tourx" aria-label="Salir del recorrido">×</button></div><h3 style="margin-top:10px">${t[1]}</h3><p class="small" style="margin-bottom:14px">${t[2]}</p><div class="row"><button class="btn btn-g" data-act="tourp" ${tourI?'':'disabled'}>← Anterior</button><button class="btn btn-p" data-act="tourn">${tourI<TOUR.length-1?'Siguiente →':'Finalizar'}</button></div></div>`;$('#tour').classList.add('open')}
function tourGo(i){tourI=i;go(TOUR[i][0]);renderTour()}

/* ============ MODAL / CONFIRM ============ */
function openEvid(id,i){const c=C(id),cs=S.cases[id],e=c.evid[i];const first=!cs.opened.includes(i);if(first){cs.opened.push(i);save()}
  $('#modal').innerHTML=`<div class="mbox"><div class="mhead"><div><small>${c.num} · DOC ${String(i+1).padStart(2,'0')} · ${e.k}</small><b>${e.t}</b></div><button class="mclose" data-act="mclose" aria-label="Cerrar documento">×</button></div><div class="mbody doc ${e.mono?'mono':''}">${e.h}<p class="fic">Documento ficticio elaborado con fines académicos.</p></div></div>`;
  $('#modal').classList.add('open');setTimeout(()=>$('#modal .mclose').focus(),30);if(first){rerender();floatPts(2,$('#modal .mbox'))}}
function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML=''}
function ask(msg,yes){const d=document.createElement('div');d.className='confirm';d.innerHTML=`<div class="panel" style="max-width:420px"><h3>${msg}</h3><p class="small mut">Esta acción no se puede deshacer.</p><div class="row"><button class="btn btn-g" data-x="no">Cancelar</button><button class="btn btn-p" data-x="yes">Confirmar</button></div></div>`;document.body.appendChild(d);d.querySelector('[data-x=no]').focus();d.addEventListener('click',ev=>{const x=ev.target.closest('[data-x]');if(!x&&ev.target!==d)return;d.remove();if(x&&x.dataset.x==='yes')yes()})}

/* ============ EVENTOS ============ */
function caseId(){const m=cur.match(/^caso-(c[123])$/);return m?m[1]:null}
document.addEventListener('click',ev=>{
  const g=ev.target.closest('[data-go]');if(g){ev.preventDefault();if(g.closest('#ovl'))$('#ovl').classList.remove('open');go(g.dataset.go);return}
  const b=ev.target.closest('[data-act]');if(!b){if(ev.target.id==='modal')closeModal();return}
  const a=b.dataset.act,id=caseId(),c=id&&C(id),cs=id&&S.cases[id],i=+b.dataset.i;
  switch(a){
  case'start':go('caso-'+b.dataset.c);break;
  case'continue':{const p=CASES.find(x=>S.cases[x.id].started&&!S.cases[x.id].done)||CASES.find(x=>!S.cases[x.id].done);go(p?'caso-'+p.id:(S.survey.length?'cierre':'evaluacion'));break}
  case'phase':cs.phase=b.dataset.p;warnEvid=false;save();rerender();window.scrollTo({top:0,behavior:S.rm?'auto':'smooth'});break;
  case'evid':openEvid(id,i);break;
  case'mclose':closeModal();break;
  case'tofacts':if(cs.opened.length<c.evid.length){warnEvid=true;rerender()}else{cs.phase='facts';save();rerender()}break;
  case'warnoff':warnEvid=false;rerender();break;
  case'bin':cs.facts[i]=b.dataset.b;save();rerender();break;
  case'factsok':{cs.factsDone=true;save();const n=score(c,cs).hechos;rerender();floatPts(n,$('.case .panel'));break}
  case'opt':{const ch=cs.choices[cs.stage]||(cs.choices[cs.stage]={recon:0});if(ch.done)break;ch.opt=i;ch.just=null;save();rerender();break}
  case'just':cs.choices[cs.stage].just=i;save();rerender();break;
  case'decide':{const before=score(c,cs).total;cs.choices[cs.stage].done=true;save();const d=score(c,cs).total-before;rerender();floatPts(d,$('.verdict'));if(c.stages[cs.stage].opts[cs.choices[cs.stage].opt].v==='riesgosa')toast('Indicador de riesgo: revisa la consecuencia de esta decisión.');break}
  case'recon':{const ch=cs.choices[cs.stage];ch.done=false;ch.recon=(ch.recon||0)+1;ch.opt=null;ch.just=null;save();rerender();break}
  case'next':if(cs.stage<3)cs.stage++;else cs.phase='order';save();rerender();window.scrollTo({top:0,behavior:S.rm?'auto':'smooth'});break;
  case'ordadd':cs.ord.push(i);save();rerender();break;
  case'ordrm':cs.ord=cs.ord.filter(x=>x!==i);save();rerender();break;
  case'ordclr':cs.ord=[];save();rerender();break;
  case'ordok':{cs.orderDone=true;save();rerender();floatPts(orderPts(c,cs),$('.verdict'));break}
  case'finish':cs.done=true;cs.final=score(c,cs);save();saveResultDB(id,cs.final);go('resultado-'+id);break;
  case'reset':{const cid=b.dataset.c;ask(`¿Reiniciar ${C(cid).num}?`,()=>{S.cases[cid]=blank();delete prevLive[cid];['intro-'+cid,'open-'+cid].forEach(k=>typed.delete(k));save();toast('Expediente reiniciado.');if(cur.endsWith(cid))go('caso-'+cid);else rerender()});break}
  case'resetall':ask('¿Reiniciar todo el progreso?',()=>{const nm=S.name,sv=S.survey,rb=S.rubric,rm=S.rm;S=fresh();S.name=nm;S.survey=sv;S.rubric=rb;S.rm=rm;typed.clear();save();toast('Progreso reiniciado. Se conservan tu nombre y las evaluaciones.');rerender()});break;
  case'nextcase':{const nx=CASES.find(x=>!S.cases[x.id].done);go(nx?'caso-'+nx.id:'evaluacion');break}
  case'ovlclose':$('#ovl').classList.remove('open');break;
  case'rm':S.rm=!S.rm;document.body.classList.toggle('rm',S.rm);save();toast(S.rm?'Animaciones reducidas.':'Animaciones activadas.');renderTop(cur||'inicio');fx();break;
  case'tour':tourOn=true;tourGo(0);break;
  case'tourn':if(tourI<TOUR.length-1)tourGo(tourI+1);else{tourOn=false;$('#tour').classList.remove('open');toast('Recorrido finalizado.')}break;
  case'tourp':if(tourI>0)tourGo(tourI-1);break;
  case'tourx':tourOn=false;$('#tour').classList.remove('open');break;
  case'dphase':selPhase=i;rerender();break;
  case'lik':draft.a[i]=+b.dataset.v;rerender();break;
  case'demosv':showDemo=!showDemo;rerender();break;
  case'clrsv':ask('¿Borrar las respuestas registradas en este navegador?',()=>{S.survey=[];save();rerender()});break;
  case'copysv':{const csv=['fecha,'+SQ.map((_,k)=>'p'+(k+1)).join(',')+',mejora',...S.survey.map(r=>[r.d,...r.a,'"'+(r.t||'').replace(/"/g,'""')+'"'].join(','))].join('\n');const done=()=>toast('Respuestas copiadas en formato CSV.');try{navigator.clipboard.writeText(csv).then(done,()=>showCsv(csv))}catch(e){showCsv(csv)}break}
  case'rub':{const k=b.dataset.k;S.rubric[k]=S.rubric[k]===false;save();rerender();break}
  }
});
function showCsv(csv){$('#csvbox').innerHTML=`<p class="small mut" style="margin-top:12px">No fue posible copiar automáticamente. Selecciona y copia el texto:</p><textarea class="inp" readonly>${esc(csv)}</textarea>`}
document.addEventListener('submit',ev=>{if(ev.target.id!=='sv')return;ev.preventDefault();if(draft.a.filter(Boolean).length<5)return;const ans=draft.a.slice(0,5),txt=draft.t.trim();S.survey.push({d:new Date().toISOString().slice(0,10),a:ans,t:txt});draft={a:[],t:''};save();rerender();if(DB)saveSurveyDB(ans,txt).then(ok=>toast(ok?'Gracias. Tu evaluación quedó guardada en la base de datos.':'Se guardó en este navegador; no fue posible enviarla a la base de datos.'));else toast('Gracias. Tu evaluación quedó registrada en este navegador.')});
document.addEventListener('input',ev=>{const k=ev.target.dataset.inp;if(k==='name'){S.name=ev.target.value.slice(0,40);save()}if(k==='svt')draft.t=ev.target.value});
document.addEventListener('change',ev=>{if(ev.target.dataset.inp==='name')rerender()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if($('#modal').classList.contains('open'))closeModal();else if($('#ovl').classList.contains('open'))$('#ovl').classList.remove('open')}});

/* ============ PARTÍCULAS ============ */
const cv=$('#fx'),cx=cv.getContext('2d');let P=[],raf=0;
function sizeFx(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;P=Array.from({length:Math.min(42,Math.round(innerWidth/32))},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*.18*devicePixelRatio,vy:(Math.random()-.5)*.18*devicePixelRatio,r:(Math.random()*1.4+.4)*devicePixelRatio}))}
function frame(){cx.clearRect(0,0,cv.width,cv.height);const D=130*devicePixelRatio;for(const p of P){p.x=(p.x+p.vx+cv.width)%cv.width;p.y=(p.y+p.vy+cv.height)%cv.height;cx.fillStyle='rgba(120,200,255,.6)';cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}for(let a=0;a<P.length;a++)for(let b2=a+1;b2<P.length;b2++){const dx=P[a].x-P[b2].x,dy=P[a].y-P[b2].y,d=Math.hypot(dx,dy);if(d<D){cx.strokeStyle=`rgba(64,224,208,${.12*(1-d/D)})`;cx.lineWidth=devicePixelRatio*.6;cx.beginPath();cx.moveTo(P[a].x,P[a].y);cx.lineTo(P[b2].x,P[b2].y);cx.stroke()}}raf=requestAnimationFrame(frame)}
function fx(){cancelAnimationFrame(raf);if(S.rm){cx.clearRect(0,0,cv.width,cv.height);return}frame()}
const onResize=()=>{sizeFx();fx()};addEventListener('resize',onResize);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else fx()});
sizeFx();fx();

/* ============ INICIO ============ */
cur=location.hash.slice(1)||'inicio';render(cur,false);initDB();
}
</script>
</body>
</html>
