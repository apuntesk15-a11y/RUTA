<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUTA · El caso bajo decisión</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: sobria, cinematográfica y profesional: un laboratorio de análisis, no un juego infantil.
   IDEA: un expediente jurídico abierto sobre una mesa de luz digital.
   PICTURE: la carpeta del expediente y la ruta luminosa de ocho etapas que se enciende con cada decisión.
   COLOUR and TYPE: azul noche y azul profundo; azul eléctrico y turquesa para la luz; dorado para logros, rojo para riesgos. Sora + Inter; Plex Mono solo en documentos.
   LAYOUT: barra superior, módulos de ancho completo, panel lateral de ruta en cada expediente; todo se apila en móvil. */
:root{color-scheme:dark;--bg:#0B1120;--deep:#14243A;--blue:#4CA9FF;--tq:#40E0D0;--ink:#F3F6FC;--mut:#9DB0CA;--gold:#F4B942;--red:#F06464;--line:rgba(76,169,255,.2);--panel:rgba(20,36,58,.66);--r:16px}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,#16305a 0,transparent 60%),radial-gradient(900px 600px at -10% 110%,#0f3a44 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.55}
h1,h2,h3,h4{font-family:Sora,Inter,sans-serif;line-height:1.1;margin:0 0 .4em;text-wrap:balance}
h2{font-size:clamp(28px,4vw,44px);font-weight:700}
h3{font-size:clamp(19px,2.2vw,23px);font-weight:600}
h4{font-size:15px;font-weight:600;color:var(--mut)}
p{margin:0 0 .8em}
a{color:var(--tq)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--tq);outline-offset:3px;border-radius:8px}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:clamp(20px,3.5vw,48px) max(4vw,16px) 40px}
.mut{color:var(--mut)}.small{font-size:13.5px}.gold{color:var(--gold)}.red{color:var(--red)}.tq{color:var(--tq)}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}.gw{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.2vw,24px);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 20px 50px -30px #000,inset 0 1px 0 rgba(255,255,255,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:rgba(76,169,255,.08);color:var(--ink);font-weight:600;font-size:15px;transition:transform .2s,background .2s,border-color .2s,box-shadow .2s;text-decoration:none}
.btn:hover{background:rgba(76,169,255,.16);border-color:rgba(76,169,255,.5);transform:translateY(-1px)}
.btn-p{background:linear-gradient(135deg,#2f8ff0,#3cc9c0);border:0;color:#04121f;box-shadow:0 10px 30px -10px rgba(64,224,208,.6)}
.btn-p:hover{background:linear-gradient(135deg,#4ca9ff,#40e0d0);box-shadow:0 14px 36px -10px rgba(64,224,208,.85)}
.btn-g{background:transparent}
.btn svg{width:18px;height:18px;flex:none}
.btn-d{border-color:rgba(240,100,100,.4);background:rgba(240,100,100,.08)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:rgba(76,169,255,.08);white-space:nowrap}
.tag.ok{color:var(--tq);border-color:rgba(64,224,208,.4);background:rgba(64,224,208,.08)}
.tag.gold{border-color:rgba(244,185,66,.45);background:rgba(244,185,66,.1)}
.tag.red{border-color:rgba(240,100,100,.45);background:rgba(240,100,100,.1)}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--tq));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar.g>i{background:linear-gradient(90deg,#d99a1f,var(--gold))}
.disc{font-size:13px;color:var(--mut);border-top:1px solid var(--line);margin-top:36px;padding-top:16px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(11,17,32,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px max(4vw,16px)}
.brand{font:800 22px Sora,system-ui,sans-serif;letter-spacing:.12em;background:none;border:0;padding:6px 0;background:linear-gradient(90deg,var(--ink),var(--tq));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--mut);font-size:14px;font-weight:500;min-height:44px}
.nav button:hover{color:var(--ink);background:rgba(76,169,255,.08)}
.nav button.on{color:var(--ink);background:rgba(76,169,255,.14);box-shadow:inset 0 -2px 0 var(--tq)}
.tools{display:flex;gap:8px;align-items:center}
.chip{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid rgba(244,185,66,.35);color:var(--gold);white-space:nowrap}
.icob{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(76,169,255,.06);display:grid;place-items:center}
.icob svg{width:20px;height:20px}
@media(max-width:760px){.phases span{font-size:11.5px}.chip{display:none}.top-in{gap:8px}.brand{font-size:19px}}
/* views */
.view{animation:viewIn .6s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.head{margin-bottom:26px}.head p{max-width:68ch}
.eyebrow{font:600 13px Inter;color:var(--tq);margin-bottom:8px;display:block}
/* hero */
.hero{min-height:calc(100vh - 0px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,4vw,60px);align-items:center;position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:40px max(4vw,16px)}
.logo{font:800 clamp(84px,15vw,190px)/.9 Sora,system-ui,sans-serif;letter-spacing:.06em;margin:0;display:flex}
.logo span{display:inline-block;background:linear-gradient(180deg,#fff 10%,#9fd0ff 60%,var(--tq));-webkit-background-clip:text;background-clip:text;color:transparent;animation:letter 1.1s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 0 30px rgba(76,169,255,.35))}
.logo span:nth-child(2){animation-delay:.12s}.logo span:nth-child(3){animation-delay:.24s}.logo span:nth-child(4){animation-delay:.36s}
@keyframes letter{from{opacity:0;transform:translateY(40px) scale(.9);filter:blur(12px)}to{opacity:1;transform:none}}
.sub{font:600 clamp(16px,2vw,21px) Sora,system-ui,sans-serif;letter-spacing:.32em;color:var(--tq);margin:10px 0 4px;animation:fadeUp .8s .6s both}
.sub2{color:var(--mut);margin-bottom:22px;animation:fadeUp .8s .7s both}
.quote{font:300 clamp(20px,2.4vw,28px)/1.3 Sora,system-ui,sans-serif;margin:0 0 26px;animation:fadeUp .8s .85s both;max-width:26ch}
.hero .btn-p{animation:fadeUp .8s 1s both,pulse 3s 2s infinite}
.big{font-size:17px;padding:16px 28px;letter-spacing:.06em}
.lead{color:var(--mut);max-width:58ch;margin-top:26px;animation:fadeUp .8s 1.15s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 10px 30px -10px rgba(64,224,208,.6)}50%{box-shadow:0 10px 50px -6px rgba(64,224,208,.95)}}
.hero-pic{position:relative;aspect-ratio:1/1;max-height:560px;width:100%;animation:fadeUp 1s .4s both}
.desk{position:absolute;inset:6% 4%;border-radius:28px;background:radial-gradient(circle at 50% 40%,rgba(76,169,255,.22),transparent 65%);border:1px solid var(--line)}
.folder{position:absolute;left:14%;top:20%;width:66%;height:58%;transform:rotate(-5deg);transform-style:preserve-3d}
.folder .back{position:absolute;inset:0;border-radius:6px 16px 16px 16px;background:linear-gradient(160deg,#1d3a5e,#122640);border:1px solid rgba(76,169,255,.35)}
.folder .back::before{content:"";position:absolute;left:0;top:-22px;width:38%;height:24px;border-radius:10px 10px 0 0;background:#1d3a5e;border:1px solid rgba(76,169,255,.35);border-bottom:0}
.paper{position:absolute;left:7%;right:7%;top:8%;bottom:6%;background:#F3F6FC;border-radius:6px;padding:8% 9%;color:#14243A;font:500 clamp(9px,1.1vw,12px)/1.7 "IBM Plex Mono",monospace;box-shadow:0 10px 30px -10px #000;transform:rotate(3deg)}
.paper.p2{transform:rotate(-2deg) translate(4%,4%);background:#e3eaf6}
.paper b{display:block;font:700 1.3em Sora,system-ui,sans-serif;margin-bottom:8px}
.paper i{display:block;height:6px;border-radius:3px;background:#c8d4e8;margin:8px 0}
.cover{position:absolute;inset:0;border-radius:6px 16px 16px 16px;background:linear-gradient(160deg,#24507f,#173459);border:1px solid rgba(76,169,255,.5);transform-origin:left center;animation:coverOpen 2.2s 1s cubic-bezier(.6,.1,.2,1) forwards;display:grid;place-items:center;backface-visibility:hidden}
.cover span{font:700 clamp(14px,2vw,22px) Sora,system-ui,sans-serif;letter-spacing:.2em;color:var(--ink);opacity:.85}
@keyframes coverOpen{to{transform:perspective(1400px) rotateY(-110deg);opacity:.15}}
.stamp{position:absolute;right:6%;bottom:12%;transform:rotate(-12deg);border:3px solid var(--gold);color:var(--gold);font:800 clamp(12px,1.6vw,18px) Sora,system-ui,sans-serif;letter-spacing:.12em;padding:6px 14px;border-radius:8px;opacity:0;animation:stamp .5s 2.8s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{from{opacity:0;transform:rotate(-12deg) scale(2)}to{opacity:.9;transform:rotate(-12deg) scale(1)}}
.hero-route{position:absolute;inset:0;width:100%;height:100%}
.hero-route path{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3s 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;animation:fadeUp .8s 1.3s both}
@media(max-width:860px){.hero{grid-template-columns:1fr;min-height:auto;padding-top:28px}.hero-pic{max-width:420px;margin:0 auto;order:-1;aspect-ratio:1.2/1}}
/* dashboard */
.prof{display:flex;gap:16px;align-items:center}
.avatar{width:64px;height:64px;border-radius:18px;flex:none;display:grid;place-items:center;font:700 24px Sora,system-ui,sans-serif;background:linear-gradient(135deg,#1f4c80,#167a7c);border:1px solid rgba(64,224,208,.4)}
.inp{width:100%;min-height:44px;font:16px Inter;color:var(--ink);background:rgba(11,17,32,.6);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea.inp{min-height:96px;resize:vertical}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px}
.kpi b{display:block;font:700 clamp(28px,3.4vw,38px) Sora,system-ui,sans-serif;line-height:1.1}
.kpi span{font-size:13.5px;color:var(--mut)}
.ring{width:132px;height:132px;flex:none}
.ring circle{fill:none;stroke-width:10}
.ring .tr{stroke:rgba(255,255,255,.07)}
.ring .fg{stroke:url(#gr);stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:4px 12px;align-items:center;margin-bottom:12px}
.skill span{font-size:14.5px}.skill em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px}
.skill .bar{grid-column:1/-1}
.track{display:flex;align-items:center;gap:0;overflow-x:auto;padding:8px 2px}
.node{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:108px;text-align:center;font-size:12.5px;color:var(--mut)}
.node i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font:700 13px Sora,system-ui,sans-serif;font-style:normal;color:var(--mut);background:var(--bg)}
.node.on i{border-color:var(--tq);color:var(--tq);box-shadow:0 0 18px rgba(64,224,208,.5)}
.node.on{color:var(--ink)}
.link{flex:1;min-width:24px;height:2px;background:var(--line);margin-bottom:24px}
.link.on{background:linear-gradient(90deg,var(--tq),var(--blue));box-shadow:0 0 10px rgba(64,224,208,.5)}
/* case cards */
.ccard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;transition:transform .3s,border-color .3s,box-shadow .3s}
.ccard:hover{transform:translateY(-4px);border-color:rgba(64,224,208,.45);box-shadow:0 30px 60px -30px rgba(64,224,208,.35)}
.ccard .num{font:500 13px "IBM Plex Mono",monospace;color:var(--tq)}
.ccard::after{content:"";position:absolute;right:-60px;top:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(76,169,255,.25),transparent 70%)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:4px 0}
.meta dt{color:var(--mut)}.meta dd{margin:0}
.dots{letter-spacing:2px;color:var(--gold)}
.done-badge{position:absolute;top:16px;right:16px;z-index:1}
/* case play */
.case{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
@media(max-width:980px){.case{grid-template-columns:1fr}.side{order:2}}
.side{display:grid;gap:14px;position:sticky;top:76px}
@media(max-width:980px){.side{position:static}}
.phases{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.phases span{flex:1;min-width:52px;font-size:12.5px;color:var(--mut);padding-top:8px;border-top:3px solid rgba(255,255,255,.08);transition:all .5s}
.phases span.on{border-color:var(--tq);color:var(--ink)}
.phases span.now{border-color:var(--blue);color:var(--ink);font-weight:600}
.narr{font:400 17px/1.7 Inter;min-height:3em}
.caret::after{content:"▍";color:var(--tq);animation:blink 1s steps(2) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.opening{position:relative;height:150px;margin:-6px 0 18px;perspective:1200px}
.opening .f{position:absolute;inset:0 10%;border-radius:10px 18px 18px 18px;background:linear-gradient(160deg,#1d3a5e,#122640);border:1px solid rgba(76,169,255,.35);display:flex;align-items:center;padding:0 6%;gap:18px}
.opening .f b{font:700 clamp(18px,3vw,30px) Sora,system-ui,sans-serif}
.opening .lid{position:absolute;inset:0 10%;border-radius:10px 18px 18px 18px;background:linear-gradient(160deg,#2a5a8f,#173459);border:1px solid rgba(76,169,255,.5);transform-origin:top;animation:lid 1.4s .2s cubic-bezier(.6,.1,.2,1) forwards;display:grid;place-items:center;font:700 16px Sora,system-ui,sans-serif;letter-spacing:.2em}
@keyframes lid{to{transform:rotateX(-100deg);opacity:0}}
.client{display:flex;gap:14px;align-items:center;margin:16px 0}
.client .avatar{width:52px;height:52px;font-size:19px;border-radius:14px}
.note{border-left:3px solid var(--gold);background:rgba(244,185,66,.07);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14.5px;margin:14px 0}
.note.red{border-color:var(--red);background:rgba(240,100,100,.08)}
.note.tq{border-color:var(--tq);background:rgba(64,224,208,.06)}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:14px}
.ev{text-align:left;position:relative;min-height:150px;padding:18px 16px 16px;border-radius:12px;background:linear-gradient(170deg,#e9eff9,#cdd8ea);color:#14243A;border:0;box-shadow:0 14px 30px -14px #000;transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column;gap:6px}
.ev:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 24px 40px -16px #000,0 0 0 2px var(--tq)}
.ev small{font:500 11.5px "IBM Plex Mono",monospace;color:#3d5577}
.ev b{font:600 16px/1.25 Sora,system-ui,sans-serif}
.ev .st{margin-top:auto;font-size:12.5px;font-weight:600;color:#3d5577}
.ev.seen .st{color:#0d7f74}
.ev::before{content:"";position:absolute;top:0;right:0;border-width:0 22px 22px 0;border-style:solid;border-color:#0B1120 #9fb3d1 #9fb3d1 #0B1120;border-radius:0 0 0 6px}
.facts{display:grid;gap:10px}
.fact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(11,17,32,.4)}
.fact.right{border-color:rgba(64,224,208,.5)}.fact.wrong{border-color:rgba(240,100,100,.5)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:transparent;font-size:13.5px;color:var(--mut)}
.seg button.on{color:#04121f;background:var(--tq);border-color:var(--tq);font-weight:600}
.seg button.on.f{background:var(--gold);border-color:var(--gold)}
.seg button.on.n{background:#7d8ea8;border-color:#7d8ea8}
@media(max-width:640px){.fact{grid-template-columns:1fr}}
.q{font:600 clamp(21px,2.6vw,27px)/1.25 Sora,system-ui,sans-serif;margin:6px 0 14px}
.opts{display:grid;gap:12px}
.opt{text-align:left;position:relative;padding:16px 18px 16px 52px;border-radius:14px;border:1px solid var(--line);background:rgba(11,17,32,.45);transition:all .25s;line-height:1.5}
.opt::before{content:attr(data-k);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:600 13px Sora,system-ui,sans-serif;border:1px solid var(--line);color:var(--mut)}
.opt:hover{border-color:rgba(76,169,255,.55);background:rgba(76,169,255,.08);transform:translateX(3px)}
.opt.sel{border-color:var(--tq);background:rgba(64,224,208,.08);box-shadow:0 0 0 1px var(--tq),0 10px 30px -14px rgba(64,224,208,.6)}
.opt.sel::before{background:var(--tq);color:#04121f;border-color:var(--tq)}
.opt.dim{opacity:.38;pointer-events:none}
.opt.lock{pointer-events:none}
.opt.v-riesgosa.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 40px -10px rgba(240,100,100,.6);animation:shake .5s}
.opt.v-riesgosa.sel::before{background:var(--red);border-color:var(--red)}
.opt.v-insuficiente.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.opt.v-insuficiente.sel::before{background:var(--gold);border-color:var(--gold)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.just{margin-top:18px;padding:16px;border-radius:14px;border:1px dashed rgba(76,169,255,.35);animation:fadeUp .4s both}
.just .opts{gap:8px}.just .opt{padding:12px 14px 12px 46px;font-size:15px}.just .opt::before{top:11px;left:12px;width:24px;height:24px}
.verdict{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;margin:18px 0 12px;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.verdict svg{width:28px;height:28px;flex:none}
.verdict b{font:700 17px Sora,system-ui,sans-serif}
.verdict.adecuada{background:rgba(64,224,208,.1);border:1px solid rgba(64,224,208,.45)}
.verdict.insuficiente{background:rgba(244,185,66,.1);border:1px solid rgba(244,185,66,.45)}
.verdict.riesgosa{background:rgba(240,100,100,.12);border:1px solid rgba(240,100,100,.5);animation:pop .5s cubic-bezier(.2,1.5,.4,1) both,alarm 1.6s .5s 2}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes alarm{50%{box-shadow:0 0 0 6px rgba(240,100,100,.15)}}
.conseq{padding:16px 18px;border-radius:14px;background:rgba(11,17,32,.5);border:1px solid var(--line);margin-bottom:12px}
.conseq h4{margin-bottom:6px}

{t:'Confirmación de compra',k:'Correo electrónico',h:`<div class="mail"><div class="h">De: pedidos@tecnonova.example<br>Para: Laura Méndez<br>Asunto: Tu pedido TN-20931 fue confirmado · 02/09/2026</div><p>Hola, Laura. Recibimos tu pago.</p><table><tr><td>Producto</td><td>Portátil Lumen 14 (16 GB RAM, 512 GB SSD) × 1</td></tr><tr><td>Total pagado</td><td class="n">$3.200.000</td></tr><tr><td>Entrega estimada</td><td><span class="hl">3 a 5 días hábiles</span></td></tr><tr><td>Dirección</td><td>Bogotá (dato anonimizado)</td></tr></table><p style="margin-top:12px"><span class="hl">Tu factura electrónica será enviada al momento del despacho.</span></p></div><div class="clue">Pista: si el producto nunca se despachó, ¿existe factura? Es información por confirmar.</div>`},
{t:'Conversación con el vendedor',k:'Chat de mensajería',h:`<div class="chat"><span class="d">09/09/2026</span><p class="b">Hola, ¿cuándo llega mi pedido TN-20931?<small>Laura</small></p><p class="a">Está en alistamiento, pronto sale.<small>TecnoNova</small></p><span class="d">16/09/2026</span><p class="b">Ya pasó el plazo y no ha llegado.<small>Laura</small></p><p class="a">Tuvimos un problema con la transportadora. <span class="hl">Nueva fecha: 23 de septiembre.</span><small>TecnoNova</small></p><span class="d">24/09/2026</span><p class="b">No llegó nada.<small>Laura</small></p><p class="a">Inventario retrasado por el proveedor. <span class="hl">Máximo el 3 de octubre.</span><small>TecnoNova</small></p><span class="d">10/10/2026</span><p class="b">¿Qué pasó? Necesito el equipo para trabajar.<small>Laura</small></p><p class="a">Su pedido está en proceso, agradecemos su paciencia.<small>TecnoNova</small></p><span class="d">14/10/2026</span><p class="b">Si no lo entregan esta semana, quiero que me devuelvan el dinero.<small>Laura · visto, sin respuesta</small></p></div><div class="clue">Pista: los mensajes muestran aplazamientos, pero ¿son un reclamo formal por el canal que la tienda indica?</div>`},
{t:'Condiciones de entrega',k:'Términos de la tienda (extracto)',h:`<h5>3. Entregas</h5><p>3.1 Los tiempos de entrega son estimados y se cuentan desde la confirmación del pago.</p><p>3.2 Los plazos podrán variar por causas ajenas a la tienda, lo cual será informado oportunamente al cliente.</p><p>3.4 <span class="hl">Si el producto no se entrega en el plazo informado, el cliente podrá solicitar la entrega o la devolución del dinero</span> a través del canal de reclamos.</p><h5>5. Peticiones, quejas y reclamos</h5><p>5.1 <span class="hl">Canal de reclamos: reclamos@tecnonova.example</span> · respuesta en máximo 15 días hábiles.</p><div class="clue">Pista: no consta que Laura haya usado el canal de reclamos. Y la cláusula 3.4 obliga a definir qué pretende: el producto o el dinero.</div>`},
{t:'Línea de tiempo de los hechos',k:'Reconstrucción preliminar',h:`<ul class="tl"><li><b>02/09</b><br>Pago total y confirmación del pedido.</li><li><b>05–09/09</b><br>Vence el plazo estimado de 3 a 5 días hábiles.</li><li><b>16/09</b><br>Primer aplazamiento: falla de transportadora.</li><li><b>24/09</b><br>Segundo aplazamiento: inventario retrasado.</li><li><b>03/10</b><br>Vence la “fecha máxima” prometida.</li><li><b>10/10</b><br>Respuesta genérica de la tienda.</li><li><b>14/10</b><br>Laura pide devolución por chat. Sin respuesta.</li></ul><div class="clue">Pista: hay al menos tres aplazamientos. Falta saber si existió reclamo escrito formal.</div>`}],

stages:[
{q:'¿Qué revisarías primero?',w:{evidencias:6,problema:2,ruta:2},intro:'Tienes los documentos sobre la mesa y a Laura esperando una respuesta. Antes de cualquier actuación, decides por dónde empezar.',
opts:[
{s:'Contrastar pago y pedido',l:'Contrastar el comprobante de pago con la confirmación del pedido para verificar que corresponden a la misma compra.',v:'adecuada',c:'El número TN-20931 aparece en ambos documentos: el vínculo entre pago y compra queda soportado. Además notas que la factura depende del despacho, que nunca ocurrió.',f:'Partir de los soportes del vínculo contractual da solidez a todo lo que sigue y revela información faltante (la factura).'},
{s:'Revisar reseñas en redes',l:'Leer las reseñas de la tienda en redes sociales para saber si es confiable.',v:'insuficiente',c:'Encuentras quejas de otros clientes. Te da contexto, pero ninguna reseña prueba lo que le pasó a Laura.',f:'El contexto puede orientar, pero no reemplaza la revisión de las pruebas del propio caso.'},
{s:'Redactar demanda de inmediato',l:'Empezar a redactar de inmediato una demanda con lo que cuenta Laura.',v:'riesgosa',flag:'precip',c:'A mitad del borrador notas que no tienes el número de pedido, ni las fechas exactas, ni sabes qué pretende Laura. El documento queda sin soporte.',f:'Actuar antes de verificar soportes y pretensiones lleva a escritos débiles y puede escoger una vía que no corresponde.'},
{s:'Leer condiciones de entrega',l:'Revisar las condiciones de entrega para saber qué plazo se informó y qué canal de reclamo existe.',v:'adecuada',c:'La cláusula 3.4 prevé la entrega o la devolución si se incumple el plazo, y existe un canal formal de reclamos que Laura no parece haber usado.',f:'Conocer lo pactado delimita qué puede exigirse y por qué canal; es un punto de partida sólido.'}],
just:[{t:'Toda actuación debe partir de soportes verificables de la compra y de lo pactado.',q:1},{t:'Así me hago una idea general del caso antes de profundizar.',q:.5},{t:'Es lo más rápido para darle una respuesta inmediata a la usuaria.',q:0}]},
{q:'¿Qué información necesitas confirmar?',w:{evidencias:4,problema:6,ruta:2},intro:'Con los primeros documentos revisados, aparecen vacíos. Decides qué confirmar con Laura.',introIf:[{f:'precip',t:'Dejaste el borrador de demanda a medias: sin datos confirmados no puedes avanzar. Toca volver a la información básica.'}],
opts:[
{s:'Reclamo previo y respuesta',l:'Si Laura ya presentó un reclamo directo y escrito, y si conserva alguna respuesta.',v:'adecuada',c:'Laura confirma que solo escribió por chat: nunca usó el canal formal. Ese dato cambia la actuación inicial.',f:'Saber si hubo reclamo previo determina el primer paso y qué constancias existen.'},
{s:'Modelo del procesador',l:'El modelo exacto del procesador del portátil.',v:'insuficiente',c:'Laura no lo recuerda y no cambia nada del análisis. Pierdes tiempo de la entrevista.',f:'No todo dato del producto es jurídicamente relevante; la información a confirmar debe servir a la decisión.'},
{s:'Nada más: demandar ya',l:'Nada más: las pruebas ya son suficientes para iniciar un proceso.',v:'riesgosa',flag:'precip',c:'Sin saber si hubo reclamo ni qué pretende Laura, cualquier actuación arranca con vacíos importantes.',f:'Dar por completa la información sin verificar es una de las causas más comunes de orientaciones fallidas.'},
{s:'Pretensión y perjuicio',l:'Qué pretende Laura (entrega o devolución) y cómo la afecta no tener el equipo.',v:'adecuada',c:'Laura prefiere la devolución del dinero: ya consiguió un equipo prestado, pero debe devolverlo pronto.',f:'La pretensión define el objeto de cualquier reclamo; la afectación ayuda a valorar la urgencia.'}],
just:[{t:'La información faltante determina qué actuación procede y qué se puede pedir.',q:1},{t:'Entre más datos tenga, mejor, aunque no sepa para qué sirven.',q:.5},{t:'Prefiero avanzar y completar los datos sobre la marcha.',q:0}]},
{q:'¿Cómo delimitarías el problema?',w:{problema:10,ruta:3},intro:'Es momento de nombrar el problema. La forma en que lo delimites orienta toda la ruta.',introIf:[{f:'precip',t:'Tu impulso inicial de demandar sigue pesando. Revisa si la calificación que elijas está sostenida por los hechos.'}],
opts:[
{s:'Incumplimiento de entrega',l:'Incumplimiento en la entrega de un producto pagado en una venta a distancia, con posible afectación de derechos como consumidora.',v:'adecuada',c:'La delimitación encaja con todos los documentos: pago probado, plazo informado, aplazamientos y falta de entrega.',f:'Una delimitación precisa y sostenida en hechos verificados permite identificar las normas y alternativas a revisar.'},
{s:'Estafa penal',l:'Una estafa cometida por la tienda.',v:'riesgosa',c:'No tienes elementos que indiquen engaño intencional desde el inicio. La calificación penal desvía el caso y puede frustrar la solución que Laura busca.',f:'Calificar con la figura más grave sin elementos suficientes es precipitado y cambia por completo la ruta.'},
{s:'Retraso que debe esperarse',l:'Un simple retraso logístico: hay que esperar.',v:'insuficiente',c:'Laura se va sin una ruta. Pasan otras dos semanas sin noticias.',f:'Minimizar el problema ignora que el plazo informado venció hace más de un mes y que existen alternativas.'},
{s:'Culpa de la transportadora',l:'Un problema de la transportadora, no de la tienda.',v:'insuficiente',c:'Laura nunca contrató con la transportadora. Descartas a la tienda sin analizar quién responde frente a la consumidora.',f:'La relación de consumo se dio con la tienda; descartarla sin análisis es prematuro.'}],
just:[{t:'Delimitar con base en hechos probados evita calificaciones precipitadas.',q:1},{t:'Es la forma en que la usuaria describe lo que le pasó.',q:.5},{t:'Es la calificación que suena más fuerte y presiona más.',q:0}]},
{q:'¿Qué actuación inicial evaluarías?',w:{problema:2,ruta:8},intro:'Ya sabes qué pasó, qué falta y qué quiere Laura. Ahora eliges la primera actuación.',introIf:[{f:'precip',t:'Varias de tus decisiones fueron apresuradas. Esta es la oportunidad de elegir una actuación proporcional.'}],
opts:[
{s:'Reclamo directo documentado',l:'Orientar un reclamo directo y escrito ante la tienda, por el canal formal, con la pretensión clara, los soportes anexos y constancia de envío.',v:'adecuada',c:'Laura envía el reclamo con el comprobante, la confirmación y los chats. Queda constancia y un plazo de respuesta que permite escalar si no contestan.',f:'Es proporcional, deja prueba y abre la puerta a otras vías si no hay respuesta satisfactoria.'},
{s:'Exponer en redes',l:'Publicar el caso en redes sociales para presionar a la tienda.',v:'riesgosa',c:'La tienda bloquea a Laura y no queda ninguna constancia formal. La presión pública no es una actuación jurídica.',f:'La exposición pública no reemplaza un reclamo y puede generar nuevos conflictos.'},
{s:'Esperar un mes',l:'Recomendar esperar un mes más antes de hacer algo.',v:'insuficiente',c:'Laura sigue sin equipo ni dinero, y el tiempo corre en su contra.',f:'Esperar sin una actuación ni constancia no protege los intereses de la usuaria.'},
{s:'Ir a juicio sin reclamo',l:'Acudir directamente a la vía judicial sin reclamo previo ni revisar requisitos.',v:'riesgosa',c:'Al revisar, descubres que debes verificar requisitos previos y que no tienes constancia de haber reclamado.',f:'Escalar sin revisar requisitos ni agotar el reclamo directo puede hacer fracasar la actuación.'}],
just:[{t:'Es proporcional, deja constancia y permite escalar si no hay respuesta.',q:1},{t:'Es la opción que genera una reacción más rápida de la tienda.',q:.5},{t:'Me evita tener que revisar requisitos y plazos.',q:0}]}],
order:{q:'¿Cómo organizarías la ruta de actuación?',items:['Recibir el relato y los soportes de Laura','Verificar pago, pedido y condiciones pactadas','Identificar la información faltante (reclamo previo, factura, pretensión)','Delimitar el problema: incumplimiento en una venta a distancia','Presentar un reclamo directo, escrito y documentado','Si no hay respuesta satisfactoria, evaluar la vía de protección al consumidor que proceda']},
refs:'Normativa a verificar: régimen vigente de protección al consumidor (en Colombia, Ley 1480 de 2011) y reglas sobre ventas a distancia.'},

{id:'c2',num:'EXP-002',title:'Un último día sin respuestas',area:'Derecho laboral',diff:'Intermedio',dots:2,time:'15–20 min',badge:'Insignia Laboral',
desc:'Un trabajador recibió un mensaje que le indicaba no volver. Tiene pagos pendientes y no sabe qué documentos reunir.',
goal:'Reconstruir los hechos, identificar qué debe verificarse de la relación laboral, detectar la información faltante y proponer una ruta inicial.',
client:{n:'Andrés Rojas',i:'AR',r:'Auxiliar de caja en un minimercado, 27 años'},
intro:'Andrés habla rápido y con rabia contenida. “Trabajé ocho meses en el minimercado. El domingo en la noche me escribieron que no volviera. Me deben la última quincena. Nunca firmé nada y el dueño dice que yo era por días.” Trae el celular y una hoja con horarios escritos a mano.',
evid:[
{t:'Mensaje de terminación',k:'Chat de mensajería',h:`<div class="chat"><span class="d">Domingo 28/09/2026 · 9:42 p. m.</span><p class="a">Andrés, a partir de mañana no tiene que volver. Ya no lo necesitamos. <span class="hl">Pase el viernes por lo suyo.</span><small>Don Hernán · Minimercado La Esquina</small></p><p class="b">¿Por qué? ¿Y lo que me deben?<small>Andrés · visto, sin respuesta</small></p></div><div class="clue">Pista: la terminación se comunicó por mensaje y sin motivo. ¿Qué significa “lo suyo”?</div>`},
{t:'Registro de pagos recibidos',k:'Billetera digital (resumen)',mono:1,h:`<table><tr><th>Fecha</th><th>Concepto</th><th>Valor</th></tr><tr><td>15/02 … 15/06</td><td>Quincena (9 pagos)</td><td class="n">$650.000 c/u</td></tr><tr><td>30/06</td><td>Quincena</td><td class="n"><span class="hl">$500.000</span></td></tr><tr><td>15/07 … 15/09</td><td>Quincena (5 pagos)</td><td class="n">$650.000 c/u</td></tr><tr><td>30/09</td><td>Quincena</td><td class="n"><span class="hl">Sin pago</span></td></tr></table><div class="clue">Pista: pagos quincenales constantes durante meses, uno incompleto y uno pendiente. ¿Cuál era el salario pactado?</div>`},
{t:'Horarios de trabajo',k:'Planilla manuscrita (transcripción)',mono:1,h:`<table><tr><th>Día</th><th>Turno</th></tr><tr><td>Lunes a sábado</td><td><span class="hl">7:00 a. m. – 7:00 p. m.</span> · almuerzo 30 min</td></tr><tr><td>Domingos alternos</td><td>8:00 a. m. – 2:00 p. m.</td></tr><tr><td colspan="2">“Turnos asignados por Don Hernán. Cambios solo con su permiso.”</td></tr></table><div class="clue">Pista: horario fijado por el empleador y jornada extensa. Son aspectos a verificar (subordinación, jornada, posibles horas extra).</div>`},
{t:'Conversaciones con el empleador',k:'Chat de mensajería',h:`<div class="chat"><span class="d">03/02/2026</span><p class="a">Empieza mañana a las 7. <span class="hl">Se le paga quincenal.</span><small>Don Hernán</small></p><span class="d">20/05/2026</span><p class="a">Hoy se queda hasta las 8, que llega mercancía.<small>Don Hernán</small></p><span class="d">01/07/2026</span><p class="b">Don Hernán, faltaron 150 de la quincena.<small>Andrés</small></p><p class="a">Después le completo.<small>Don Hernán</small></p><span class="d">02/10/2026</span><p class="b">¿Me va a pagar la liquidación?<small>Andrés</small></p><p class="a"><span class="hl">Usted era por días, aquí no hay contrato.</span> Venga y le doy lo de la última semana.<small>Don Hernán</small></p></div><div class="clue">Pista: el empleador niega la existencia de contrato, pero sus propios mensajes hablan de órdenes, horario y pago quincenal.</div>`},
{t:'Relato cronológico del trabajador',k:'Declaración escrita de Andrés',h:`<p>“Empecé el <b>3 de febrero</b>. Atendía la caja, recibía mercancía y organizaba estantes. Don Hernán me decía qué hacer y a qué hora llegar.</p><p>Nunca firmé nada. <span class="hl">No sé si me afiliaron a salud o pensión</span>; cuando me enfermé en mayo fui a una cita por mi cuenta.</p><p>Nunca me pagaron prima ni vacaciones. El 28 de septiembre me escribieron que no volviera. <span class="hl">Me deben la última quincena</span> y los $150.000 de junio.</p><p>Una compañera, Yésica, trabajó conmigo todo ese tiempo y vio todo.”</p><div class="clue">Pista: aparecen datos por verificar (afiliación, prima, vacaciones) y una posible testigo.</div>`}],

{t:'Recibía pagos quincenales por su trabajo.',b:'r'},
{t:'¿Hubo contrato escrito o verbal y en qué términos?',b:'f'},

stages:[
{q:'¿Qué hechos deben aclararse?',w:{problema:6,evidencias:2,ruta:2},intro:'Andrés quiere saber “cuánto le deben”. Antes de responder, decides qué hechos aclarar.',
opts:[
{s:'Condiciones reales de la relación',l:'Las condiciones reales de la relación: fechas de inicio y fin, funciones, horario, salario y quién daba las órdenes.',v:'adecuada',c:'Andrés detalla funciones, horario fijo y órdenes de Don Hernán. Aparece una imagen clara de cómo funcionaba la relación.',f:'Las condiciones reales, más allá de cómo las nombre el empleador, son la base para verificar si hubo relación laboral.'},
{s:'Motivo personal del despido',l:'Por qué cree Andrés que lo despidieron, para saber si fue algo personal.',v:'insuficiente',c:'Andrés cree que fue por pedir el pago de junio. Es un dato útil, pero aún no sabes cómo era la relación.',f:'El motivo puede importar, pero primero hay que reconstruir los elementos de la relación.'},
{s:'Ninguno: despido injusto',l:'Ninguno: el mensaje basta para afirmar que fue un despido injusto.',v:'riesgosa',flag:'precip',c:'Le dices a Andrés que “ganó”. Minutos después notas que ni siquiera sabes cuál era su salario.',f:'Concluir antes de reconstruir los hechos genera expectativas que el caso puede no sostener.'},
{s:'Cuánto quiere recibir',l:'Cuánto dinero quiere recibir Andrés.',v:'insuficiente',c:'Andrés dice una cifra al azar. No tienes cómo saber si es razonable.',f:'La expectativa económica no es un hecho del caso; los montos dependen de verificar la relación y los pagos.'}],
just:[{t:'Las condiciones reales de la relación determinan qué derechos deben verificarse.',q:1},{t:'Entender cómo se siente Andrés ayuda a orientarlo.',q:.5},{t:'El mensaje de terminación ya lo dice todo.',q:0}]},
{q:'¿Qué documentos son importantes?',w:{evidencias:8,ruta:2},intro:'Andrés tiene información dispersa en su celular y en papeles. Decides qué reunir.',introIf:[{f:'precip',t:'Calificaste el caso como “despido injusto” desde el inicio. Al revisar, notas que te faltan casi todos los soportes.'}],
opts:[
{s:'Pagos, horarios, chats y testigos',l:'Registro de pagos, horarios, mensajes con el empleador y posibles testigos, organizados cronológicamente.',v:'adecuada',flag:'org',c:'Con la cronología armada se ven pagos quincenales constantes, órdenes de horario y una testigo disponible: indicios importantes.',f:'Organizar las pruebas por fecha permite sustentar cada afirmación y detectar vacíos.'},
{s:'Solo el mensaje',l:'Solo el mensaje de terminación.',v:'riesgosa',flag:'omit',c:'Sin pagos ni horarios no puedes sustentar cómo era la relación. El análisis queda incompleto.',f:'Omitir pruebas disponibles debilita cualquier reclamación posterior.'},
{s:'Carta de un cliente',l:'Una carta de recomendación de un cliente del minimercado.',v:'insuficiente',c:'El cliente confirma que Andrés atendía la caja, pero no aporta nada sobre horario, órdenes o pagos.',f:'Puede servir como apoyo, pero no es una prueba central de las condiciones de la relación.'},
{s:'Certificados de estudio',l:'Los certificados de estudio de Andrés.',v:'insuficiente',c:'No aportan a la reconstrucción de la relación laboral.',f:'Los documentos deben elegirse según lo que se necesita probar.'}],
just:[{t:'Organizar las pruebas por fecha permite sustentar cada afirmación.',q:1},{t:'Cualquier documento puede servir más adelante.',q:.5},{t:'Reunir pruebas retrasa la orientación.',q:0}]},
{q:'¿Qué preguntas realizarías antes de orientar?',w:{problema:4,ruta:5},intro:'Antes de orientar, tienes la oportunidad de preguntar lo que Andrés no sabe que es importante.',introIf:[{f:'omit',t:'Solo tienes el mensaje de terminación. Las preguntas que hagas ahora son clave para recuperar información.'},{f:'org',t:'Con la cronología organizada, ya ves qué falta. Tus preguntas pueden ir directo a los vacíos.'}],
opts:[
{s:'Preguntas abiertas y concretas',l:'¿Firmó algún documento? ¿Le pagaron prima, vacaciones o seguridad social? ¿Recibió liquidación? ¿Alguien puede confirmar los hechos?',v:'adecuada',c:'Andrés recuerda que nunca vio descuentos de salud ni pensión y que Yésica puede declarar. Surgen aspectos clave por verificar.',f:'Preguntas concretas revelan información decisiva que el usuario no sabe que importa.'},
{s:'¿Quiere demandar ya?',l:'¿Quiere demandar ya mismo?',v:'insuficiente',c:'Andrés dice que sí, pero no sabe qué implica. La pregunta anticipa una ruta antes de tener la información.',f:'Una pregunta cerrada sobre la ruta llega antes de tiempo; primero hay que completar los hechos.'},
{s:'¿Se llevaba bien con el jefe?',l:'¿Se llevaba bien con el jefe?',v:'insuficiente',c:'La respuesta es emocional y no aporta a los aspectos que debes verificar.',f:'No toda pregunta sobre la relación personal es jurídicamente útil.'},

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const n5=t=>(Math.round(t/2)/10).toFixed(1);const d5=t=>(t/20).toFixed(2);
function seedShuffle(n,seed){const a=[...Array(n).keys()];let s=seed%233280||7;for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.every((v,i)=>v===i))a.reverse();return a}
const hash=str=>[...str].reduce((h,c)=>(h*31+c.charCodeAt(0))%100000,17);
function lis(a){const t=[];for(const x of a){let lo=0,hi=t.length;while(lo<hi){const m=(lo+hi)>>1;if(t[m]<x)lo=m+1;else hi=m}t[lo]=x}return t.length}
function orderPts(c,cs){if(!cs.orderDone)return 0;const n=c.order.items.length;return 10*(lis(cs.ord)-1)/(n-1)}
function flags(c,cs){return cs.choices.map((ch,i)=>ch&&ch.done?c.stages[i].opts[ch.opt].flag:null).filter(Boolean)}
function score(c,cs){
  const d={hechos:0,problema:0,evidencias:0,ruta:0,argumentacion:0};
  if(cs.factsDone){let ok=0;c.facts.forEach((f,i)=>{if(cs.facts[i]===f.b)ok++});d.hechos=20*ok/c.facts.length}
  d.evidencias=10*cs.opened.length/c.evid.length;
  cs.choices.forEach((ch,i)=>{if(!ch||!ch.done)return;const st=c.stages[i],q=Q[st.opts[ch.opt].v];for(const k in st.w)d[k]+=st.w[k]*q;d.argumentacion+=3.75*st.just[ch.just].q});
  d.ruta+=orderPts(c,cs);
  d.total=d.hechos+d.problema+d.evidencias+d.ruta+d.argumentacion;
  return d;
}

function floatPts(n,el){if(n<=0)return;const r=(el||document.body).getBoundingClientRect();const f=document.createElement('div');f.className='float';f.textContent='+'+d5(n);f.style.left=Math.min(innerWidth-120,r.left+r.width/2-40)+'px';f.style.top=Math.max(80,r.top+20)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1500)}
function sparks(n=26){if(S.rm)return;const cx=innerWidth/2,cy=innerHeight/2;const cols=['#F4B942','#40E0D0','#4CA9FF'];for(let i=0;i<n;i++){const s=document.createElement('i');s.className='spark';const a=Math.random()*Math.PI*2,d=90+Math.random()*160;s.style.cssText=`left:${cx}px;top:${cy}px;background:${cols[i%3]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}

const VICON={adecuada:ICON.check,insuficiente:ICON.warn,riesgosa:ICON.risk};

/* ============ TYPEWRITER ============ */
const typed=new Set();let typeTok=0;
function runType(){
  document.querySelectorAll('[data-tkey]').forEach(el=>{
    const k=el.dataset.tkey,txt=el.textContent;
    if(S.rm||typed.has(k))return;
    typed.add(k);const tok=++typeTok;el.textContent='';el.classList.add('caret');let i=0;
    const skip=()=>{i=txt.length};el.addEventListener('click',skip,{once:true});
    (function step(){if(!el.isConnected)return;i=Math.min(txt.length,i+2);el.textContent=txt.slice(0,i);if(i<txt.length)setTimeout(step,18);else el.classList.remove('caret')})();
  });
}
function countUps(){document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,from=+(el.dataset.from||0),dc=+(el.dataset.dec||0),fm=v=>dc?v.toFixed(dc):r0(v);if(S.rm||from===to){el.textContent=fm(to);return}const t0=performance.now(),dur=1100;(function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fm(from+(to-from)*e);if(p<1)requestAnimationFrame(f)})(t0)})}
function bars(){requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll('[data-w]').forEach(el=>el.style.width=el.dataset.w+'%');document.querySelectorAll('[data-off]').forEach(el=>el.style.strokeDashoffset=el.dataset.off)}))}

/* ============ ROUTER ============ */
let cur='',last='';const prevLive={};
const NAV=[['panel','Panel'],['expedientes','Expedientes'],['proceso','Del problema al prototipo'],['evaluacion','Evaluación'],['matriz','Matriz'],['cierre','Resultados']];
function go(h){cur=h;render(h,false);window.scrollTo({top:0,behavior:S.rm?'auto':'smooth'});try{if(location.hash.slice(1)!==h)location.hash=h}catch(e){}}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'inicio';if(h!==cur){cur=h;render(h,false)}});
function rerender(){render(cur,true)}
function render(h,soft){
  const app=$('#app');let html='';
  const m=h.match(/^(caso|resultado)-(c[123]|demo)$/);
  if(h==='panel')html=vPanel();else if(h==='expedientes')html=vCases();
  else if(m&&m[1]==='caso'&&C(m[2]))html=vCase(m[2]);
  else if(m&&m[1]==='resultado')html=m[2]==='demo'?vResult('c1',DEMO):(S.cases[m[2]]&&S.cases[m[2]].done?vResult(m[2]):vCase(m[2]));
  else if(h==='proceso')html=vDesign();else if(h==='evaluacion')html=vSurvey();else if(h==='matriz')html=vMatrix();else if(h==='cierre')html=vClose();
  else{h='inicio';html=vIntro()}
  const isNew=h!==last;last=h;
  app.innerHTML=`<div class="${isNew&&!soft?'view':''}">${html}</div>`;
  renderTop(h);runType();countUps();bars();if(tourOn)renderTour();
  if(m&&m[1]==='resultado'&&m[2]!=='demo'){const cs=S.cases[m[2]];if(cs&&cs.done&&!cs.celebrated){cs.celebrated=true;save();celebrate(m[2])}}
}
function renderTop(h){
  const top=$('#top');top.hidden=h==='inicio';if(top.hidden)return;
  const dn=CASES.filter(c=>S.cases[c.id].done);const tot=dn.length?dn.reduce((a,c)=>a+S.cases[c.id].final.total,0)/dn.length:0;
  const key=h.startsWith('caso')||h.startsWith('resultado')?'expedientes':h;
  top.innerHTML=`<div class="top-in"><button class="brand" data-go="inicio" aria-label="Inicio de RUTA">RUTA</button><nav class="nav" aria-label="Módulos">${NAV.map(([k,l])=>`<button data-go="${k}" class="${k===key?'on':''}">${l}</button>`).join('')}</nav><div class="tools"><span class="chip" title="Promedio de los expedientes completados (escala 0 a 5)">Promedio ${n5(tot)} / 5.0</span><button class="icob" data-act="tour" aria-label="Recorrido demostrativo" title="Recorrido demostrativo">${ICON.tour}</button><button class="icob" data-act="rm" aria-pressed="${!!S.rm}" aria-label="${S.rm?'Activar animaciones':'Reducir animaciones'}" title="${S.rm?'Animaciones reducidas: activar':'Reducir animaciones'}">${S.rm?ICON.still:ICON.motion}</button></div></div>`;
}

<div class="hero-pic" aria-hidden="true"><div class="desk"></div><svg class="hero-route" viewBox="0 0 400 400"><path d="M40 360 C 90 300, 60 250, 130 230 S 230 260, 260 200 S 330 120, 370 50" fill="none" stroke="url(#gr)" stroke-width="3" stroke-linecap="round" opacity=".9"/>${[[40,360],[130,230],[260,200],[370,50]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6" fill="#0B1120" stroke="#40E0D0" stroke-width="3"/>`).join('')}</svg><div class="folder"><div class="back"></div><div class="paper p2"></div><div class="paper"><b>EXPEDIENTE</b>Hechos · Evidencias · Problema<i></i><i style="width:80%"></i><i style="width:60%"></i>Decisión · Ruta<i style="width:70%"></i><i style="width:85%"></i></div><div class="cover"><span>EXP 001–003</span></div></div><div class="stamp">EN ANÁLISIS</div></div></section>`}

/* ============ VISTA: PANEL ============ */
function skillVals(){
  const done=CASES.filter(c=>S.cases[c.id].done);if(!done.length)return null;
  const avg=k=>done.reduce((a,c)=>a+S.cases[c.id].final[k]/DIMS.find(d=>d[0]===k)[2],0)/done.length*100;
  let qs=[];done.forEach(c=>S.cases[c.id].choices.forEach((ch,i)=>qs.push(Q[c.stages[i].opts[ch.opt].v])));
  return[['Análisis de hechos',avg('hechos')],['Identificación del problema jurídico',avg('problema')],['Revisión de evidencias',avg('evidencias')],['Toma de decisiones',qs.reduce((a,b)=>a+b,0)/qs.length*100],['Argumentación',avg('argumentacion')],['Construcción de rutas de actuación',avg('ruta')]];
}
function vPanel(){
  const done=CASES.filter(c=>S.cases[c.id].done).length;
  const tot=done?CASES.reduce((a,c)=>a+(S.cases[c.id].done?S.cases[c.id].final.total:0),0)/done:0;
  const prog=r0((CASES.reduce((a,c)=>{const cs=S.cases[c.id];if(cs.done)return a+1;if(!cs.started)return a;const p=['intro','evid','facts','stage','order'].indexOf(cs.phase);return a+(p+cs.choices.filter(x=>x&&x.done).length*.4)/7},0))/3*100);
  const sk=skillVals();const name=S.name||'Investigador/a';
  const nodes=[...CASES.map(c=>[c.num.replace('EXP-',''),c.area.split(' · ').pop(),S.cases[c.id].done]),['EV','Evaluación',S.survey.length>0],['FIN','Resultados',done===3]];
  return`<div class="wrap"><div class="head"><span class="eyebrow">Panel de investigador</span><h2>Bienvenido/a al laboratorio, ${esc(name)}</h2><p class="mut">Tres expedientes esperan análisis. Cada decisión deja huella en tu ruta.</p></div>
<div class="grid g2"><div class="panel"><div class="prof"><div class="avatar">${esc((S.name||'IJ').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase())}</div><div style="flex:1"><label class="small mut" for="nm">Nombre del investigador</label><input id="nm" class="inp" data-inp="name" value="${esc(S.name)}" placeholder="Escribe tu nombre" autocomplete="name"><div class="row" style="margin-top:8px"><span class="tag ok">Nivel: Investigador jurídico</span></div></div></div>
<div class="row" style="margin-top:22px;gap:22px;flex-wrap:nowrap"><svg class="ring" viewBox="0 0 132 132" role="img" aria-label="Progreso general ${prog}%"><circle class="tr" cx="66" cy="66" r="54"/><circle class="fg" cx="66" cy="66" r="54" stroke-dasharray="339.3" stroke-dashoffset="339.3" data-off="${339.3*(1-prog/100)}" transform="rotate(-90 66 66)"/><text x="66" y="62" text-anchor="middle" fill="#F3F6FC" font-family="Sora" font-weight="700" font-size="28">${prog}%</text><text x="66" y="84" text-anchor="middle" fill="#9DB0CA" font-size="12">progreso</text></svg>
<div class="kpis" style="flex:1"><div class="kpi"><b data-count="${3-done}">0</b><span>Casos disponibles</span></div><div class="kpi"><b data-count="${done}">0</b><span>Casos completados</span></div><div class="kpi"><b class="gold" data-count="${tot/20}" data-dec="1">0</b><span>Calificación promedio / 5.0</span></div></div></div>
<div class="row" style="margin-top:20px"><button class="btn btn-p" data-act="continue">Continuar investigación</button><button class="btn btn-g" data-go="expedientes">Ver expedientes</button></div></div>
<div class="panel"><h3>Habilidades desarrolladas</h3><p class="small mut">${sk?'Promedio de los expedientes completados.':'Se calculan al completar tu primer expediente.'}</p>${(sk||[['Análisis de hechos',0],['Identificación del problema jurídico',0],['Revisión de evidencias',0],['Toma de decisiones',0],['Argumentación',0],['Construcción de rutas de actuación',0]]).map(([l,v])=>`<div class="skill"><span>${l}</span><em>${r0(v)}%</em><div class="bar"><i data-w="${v}"></i></div></div>`).join('')}</div></div>
<div class="panel" style="margin-top:18px"><h3>Ruta de progreso</h3><div class="track">${nodes.map((n,i)=>`${i?`<div class="link ${nodes[i-1][2]?'on':''}"></div>`:''}<div class="node ${n[2]?'on':''}"><i>${n[0]}</i>${n[1]}</div>`).join('')}</div>
<div class="row" style="margin-top:10px"><button class="btn btn-g btn-d" data-act="resetall">Reiniciar todo el progreso</button></div></div>${DISC}</div>`}

/* ============ VISTA: EXPEDIENTES ============ */
function vCases(){return`<div class="wrap"><div class="head"><span class="eyebrow">Selección de expedientes</span><h2>Elige un expediente para investigar</h2><p class="mut">Cada caso es una historia ramificada: tus decisiones cambian lo que ocurre después. Puedes resolverlos en cualquier orden.</p></div><div class="grid g3">${CASES.map(c=>{const cs=S.cases[c.id];const st=cs.done?'Completado':cs.started?'En curso':'Disponible';return`<article class="panel ccard">${cs.done?`<span class="tag gold done-badge">${n5(cs.final.total)} / 5.0</span>`:''}<span class="num">${c.num}</span><h3>${c.title}</h3><div class="row"><span class="tag">${c.area}</span><span class="tag ${cs.done?'ok':cs.started?'gold':''}">${st}</span></div><p class="mut" style="margin:6px 0 0">${c.desc}</p><dl class="meta"><dt>Dificultad</dt><dd><span class="dots" aria-hidden="true">${'●'.repeat(c.dots)}${'○'.repeat(3-c.dots)}</span> ${c.diff}</dd><dt>Tiempo</dt><dd>${c.time}</dd><dt>Objetivo</dt><dd>${c.goal}</dd></dl><div class="row" style="margin-top:auto">${cs.done?`<button class="btn btn-p" data-go="resultado-${c.id}">Ver resultado</button><button class="btn btn-g" data-act="reset" data-c="${c.id}">Reiniciar caso</button>`:`<button class="btn btn-p" data-act="start" data-c="${c.id}">${cs.started?'Continuar':'Abrir expediente'}</button>${cs.started?`<button class="btn btn-g" data-act="reset" data-c="${c.id}">Reiniciar</button>`:''}`}</div></article>`}).join('')}</div>${DISC}</div>`}

/* ============ VISTA: CASO ============ */
function vCase(id){
  const c=C(id),cs=S.cases[id];if(!cs.started){cs.started=true;save()}
  const sc=score(c,cs),pl=prevLive[id]??sc.total;prevLive[id]=sc.total;
  const ph=['intro','evid','facts','stage','order'],pi=ph.indexOf(cs.phase);
  const plabels=['Apertura','Evidencias','Hechos','Decisiones','Ruta'];
  let body='';
  if(cs.phase==='intro')body=pIntro(c,cs);else if(cs.phase==='evid')body=pEvid(c,cs);else if(cs.phase==='facts')body=pFacts(c,cs);else if(cs.phase==='stage')body=pStage(c,cs);else body=pOrder(c,cs);
  const nDone=cs.choices.filter(x=>x&&x.done).length;
  const lit=[cs.started,cs.factsDone,cs.opened.length>=c.evid.length,nDone>=3,cs.factsDone&&nDone>=2,nDone>=4,nDone>=4,cs.orderDone];
  return`<div class="wrap"><div class="row" style="justify-content:space-between;margin-bottom:10px"><div><span class="eyebrow">${c.num} · ${c.area}</span><h2 style="font-size:clamp(24px,3.2vw,36px)">${c.title}</h2></div><button class="btn btn-g" data-go="expedientes">← Expedientes</button></div>
<div class="phases" aria-label="Fases del expediente">${plabels.map((l,i)=>`<span class="${i<pi?'on':i===pi?'now':''}">${l}${i===3&&cs.phase==='stage'?` ${cs.stage+1}/4`:''}</span>`).join('')}</div>
<div class="case"><section class="panel">${body}</section>
<aside class="side"><div class="panel"><h4>Calificación del expediente (0 a 5)</h4><div><b style="font:800 40px Sora,sans-serif" data-count="${sc.total/20}" data-from="${pl/20}" data-dec="1">0</b><span class="mut"> / 5.0</span></div><div class="mini">${DIMS.map(([k,l,mx])=>`<div><span>${l}</span><em>${d5(sc[k])}/${d5(mx)}</em><div class="bar"><i data-w="${sc[k]/mx*100}"></i></div></div>`).join('')}</div></div>
<div class="panel"><h4>Ruta en construcción</h4><ol class="rail">${STEPS.map((s,i)=>`<li class="${lit[i]?'on':''}">${s}</li>`).join('')}</ol></div>
${cs.phase!=='intro'?`<div class="panel"><h4>Evidencias</h4><div class="evlist">${c.evid.map((e,i)=>`<button data-act="evid" data-i="${i}"><span>${e.t}</span><span class="${cs.opened.includes(i)?'tq':'mut'}">${cs.opened.includes(i)?'✓':'○'}</span></button>`).join('')}</div></div>`:''}
<button class="btn btn-g btn-d" data-act="reset" data-c="${id}">Reiniciar este caso</button></aside></div>${DISC}</div>`;
}
function pIntro(c,cs){
  const first=!typed.has('open-'+c.id);typed.add('open-'+c.id);
  return`${first&&!S.rm?`<div class="opening" aria-hidden="true"><div class="f"><b>${c.num}</b><span class="mut">${c.title}</span></div><div class="lid">EXPEDIENTE</div></div>`:''}
<span class="eyebrow">Recepción del caso</span><div class="client"><div class="avatar">${c.client.i}</div><div><b>${c.client.n}</b><br><span class="small mut">${c.client.r}</span></div></div>
<p class="narr" data-tkey="intro-${c.id}">${c.intro}</p>${c.sens?`<div class="note tq">${c.sens}</div>`:''}
<div class="note"><b>Reto del investigador:</b> ${c.goal}</div>
<div class="row"><button class="btn btn-p" data-act="phase" data-p="evid">Abrir evidencias →</button></div>`}
function pEvid(c,cs){
  const left=c.evid.length-cs.opened.length;
  return`<span class="eyebrow">Revisión de evidencias</span><h3>Examina los documentos del expediente</h3><p class="mut">Abre cada documento. Las pistas te ayudarán a distinguir hechos relevantes de información faltante.</p>
<div class="evs">${c.evid.map((e,i)=>`<button class="ev ${cs.opened.includes(i)?'seen':''}" data-act="evid" data-i="${i}"><small>DOC ${String(i+1).padStart(2,'0')} · ${e.k}</small><b>${e.t}</b><span class="st">${cs.opened.includes(i)?'✓ Revisado':'Sin revisar'}</span></button>`).join('')}</div>
${warnEvid?`<div class="note red" role="alert"><b>Indicador de riesgo:</b> tienes ${left} evidencia${left>1?'s':''} sin revisar. Avanzar sin revisarlas afecta tu puntaje en Revisión de evidencias y puede ocultarte información clave.</div><div class="row"><button class="btn btn-g" data-act="warnoff">Seguir revisando</button><button class="btn btn-d btn-g" data-act="phase" data-p="facts">Avanzar de todas formas</button></div>`:`<div class="row" style="margin-top:18px"><span class="tag ${left?'':'ok'}">${cs.opened.length}/${c.evid.length} revisadas</span><button class="btn btn-p" data-act="tofacts">Ir al tablero de hechos →</button></div>`}`}
let warnEvid=false;
function pFacts(c,cs){
  const all=c.facts.every((f,i)=>cs.facts[i]);
  return`<span class="eyebrow">Reconstrucción de hechos</span><h3>Tablero de hechos</h3><p class="mut">Clasifica cada enunciado: ¿es un hecho relevante para el caso, una información que falta confirmar o un dato que no es relevante?</p>
<div class="facts">${c.facts.map((f,i)=>{const v=cs.facts[i];const cls=cs.factsDone?(v===f.b?'right':'wrong'):'';return`<div class="fact ${cls}"><div>${f.t}${cs.factsDone&&v!==f.b?`<div class="small red">Correcto: ${BIN[f.b]}</div>`:''}</div><div class="seg" role="group" aria-label="Clasificación">${['r','f','n'].map(b=>`<button class="${v===b?'on '+b:''}" data-act="bin" data-i="${i}" data-b="${b}" ${cs.factsDone?'disabled':''} aria-pressed="${v===b}">${BIN[b]}</button>`).join('')}</div></div>`}).join('')}</div>
${cs.factsDone?(()=>{const ok=c.facts.filter((f,i)=>cs.facts[i]===f.b).length;return`<div class="verdict ${ok>=6?'adecuada':ok>=4?'insuficiente':'riesgosa'}">${VICON[ok>=6?'adecuada':ok>=4?'insuficiente':'riesgosa']}<div><b>${ok} de ${c.facts.length} clasificaciones acertadas</b><br><span class="small">Distinguir lo que sabes de lo que falta confirmar es la base de una orientación prudente.</span></div></div><button class="btn btn-p" data-act="phase" data-p="stage">Pasar a las decisiones →</button>`})():`<div class="row" style="margin-top:18px"><button class="btn btn-p" data-act="factsok" ${all?'':'disabled'}>Confirmar tablero</button><span class="small mut">${Object.keys(cs.facts).length}/${c.facts.length} clasificados</span></div>`}`}
function pStage(c,cs){
  const si=cs.stage,st=c.stages[si],ch=cs.choices[si]||{};const fl=flags(c,cs);
  const ctx=(st.introIf||[]).filter(x=>fl.includes(x.f)).map(x=>x.t);
  const oo=seedShuffle(st.opts.length,hash(c.id+si)),jo=seedShuffle(st.just.length,hash(c.id+'j'+si));
  const K='ABCD';
  let h=`<span class="eyebrow">Decisión ${si+1} de 4</span>${ctx.map(t=>`<div class="note ${fl.includes('precip')||fl.includes('omit')?'red':'tq'}"><b>Consecuencia de decisiones anteriores:</b> ${t}</div>`).join('')}<p class="mut">${st.intro}</p><p class="q">${st.q}</p>
<div class="opts" role="group" aria-label="Opciones">${oo.map((oi,k)=>{const o=st.opts[oi];const sel=ch.opt===oi;const cls=ch.done?(sel?`sel lock v-${o.v}`:'dim'):(sel?'sel':'');return`<button class="opt ${cls}" data-k="${K[k]}" data-act="opt" data-i="${oi}" aria-pressed="${sel}">${o.l}</button>`}).join('')}</div>`;

  if(ch.done){const o=st.opts[ch.opt],q=Q[o.v],jq=st.just[ch.just].q;const pts=Object.entries(st.w).map(([k,w])=>`<span class="tag ${q===1?'ok':q?'gold':'red'}">+${d5(w*q)} ${DIMS.find(d=>d[0]===k)[1].split(' ').pop()}</span>`).join('')+`<span class="tag ${jq===1?'ok':jq?'gold':'red'}">+${d5(3.75*jq)} argumentación</span>`;
